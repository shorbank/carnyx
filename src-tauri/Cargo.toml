[package]
name = "carnyx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "carnyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher"] }
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
snow = "0.10"
base64 = "0.22"
if-addrs = "0.15"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
windows-native-keyring-store = "1"

[dev-dependencies]
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "test-utils", "tls-ring"] }
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Upstream bindings/build; only the SQLCipher amalgamation is updated to 4.19.0.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
